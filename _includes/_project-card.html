{% assign p = include.project %}
<a href="{{ p.url | relative_url }}" class="card" data-tags="{{ p.tags | join: ',' }}">
  <div class="card-media" style="{% unless p.image %}background:{{ p.card_color | default: '#57564F' }};{% endunless %}">
    {% if p.image %}
      <img src="{{ p.image | relative_url }}" alt="{{ p.title }}">
    {% else %}
      <span class="placeholder">{{ p.card_glyph | default: p.title | slice: 0, 2 }}</span>
    {% endif %}
    {% if p.duration %}<span class="yr">{{ p.duration }}</span>{% endif %}
  </div>
  <div class="card-body">
    <div class="tag"><span class="crossmark"></span><span class="mono">{{ p.tags | first }}</span></div>
    <h4>{{ p.title }}</h4>
    <p>{{ p.excerpt }}</p>
  </div>
</a>
