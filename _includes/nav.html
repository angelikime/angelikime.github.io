<aside class="sidebar">
  <div class="sidebar-top">
    <a href="{{ '/' | relative_url }}" class="logo">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="angeliki kalandatze" style="height:40px; width:auto;">
    </a>
    <nav><ul>
      <li><a href="{{ '/projects/' | relative_url }}" class="{% if page.url contains '/projects' %}active{% endif %}"><span class="dot"></span>Work</a></li>
      <li><a href="{{ '/#services' | relative_url }}"><span class="dot"></span>Services</a></li>
      <li><a href="{{ '/about/' | relative_url }}" class="{% if page.url contains '/about' %}active{% endif %}"><span class="dot"></span>About</a></li>
      <li><a href="{{ '/contact/' | relative_url }}" class="{% if page.url contains '/contact' %}active{% endif %}"><span class="dot"></span>Contact</a></li>
    </ul></nav>
  </div>
  <div class="sidebar-bottom">
    <p class="avail mono">Vienna, Austria<br>Available for remote work</p>
    <div class="social">
      {% include social-icons.html %}
    </div>
    <div class="colorbar"><span class="c"></span><span class="m"></span><span class="y"></span><span class="k"></span></div>
  </div>
</aside>

<div class="topbar">
  <a href="{{ '/' | relative_url }}" class="logo">
    <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="angeliki kalandatze" style="height:32px; width:auto;">
  </a>
  <button class="burger" id="burgerBtn" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
</div>
<div class="mobile-drawer" id="mobileDrawer">
  <nav><ul>
    <li><a href="{{ '/projects/' | relative_url }}">Projects</a></li>
    <li><a href="{{ '/#services' | relative_url }}">Services</a></li>
    <li><a href="{{ '/about/' | relative_url }}">About</a></li>
    <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
  </ul></nav>
  <div>
    <p class="mono" style="margin-bottom:14px;">Vienna, Austria — available for remote work</p>
    <div class="social" style="display:flex; gap:18px;">
      {% include social-icons.html %}
    </div>
  </div>
</div>
