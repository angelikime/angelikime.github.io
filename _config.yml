# --- Portfolio collection ---
# Every file in _projects/ becomes a project page at /work/<filename>/
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
    values:
      layout: "default"

markdown: kramdown
kramdown:
  input: GFM

# Social / footer links — edit these once, they show up everywhere
social:
  linkedin: "#"
  instagram: "#"
  upwork: "#"

exclude:
  - README.md
